<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login Admin / Petugas</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>

<body class="page-login">
  <main class="login-page">
    <section class="login-wrapper">

      <section class="info-card" aria-label="Informasi akses internal petugas">
        <div class="image-box">
          <img src="{{ url_for('static', filename='assets/loginImg.webp') }}" alt="Petugas pemadam kebakaran" />
        </div>

        <div class="info-content">
          <h1>Akses Internal Petugas</h1>
          <p>Masuk untuk memantau laporan, armada, petugas dan analitik layanan</p>
        </div>
      </section>

      <section class="form-card" aria-label="Form login admin dan petugas">
        <div class="form-header">
          <h2>Login Admin / Petugas</h2>
          <p>Masukkan akun resmi untuk akses internal.</p>
        </div>

        <form class="login-form" method="POST" action="{{ url_for('login') }}">
          <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" placeholder="nama.Petugas" required />
          </div>

          <div class="form-group">
            <label for="password">Password</label>

            <div class="password-field">
              <input type="password" id="password" name="password" placeholder="1234567890" required />

              <button type="button" class="eye-button" aria-label="Tampilkan password">
                <svg width="25" height="25" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path
                    d="M1.5 12C1.5 12 5.25 5.25 12 5.25C18.75 5.25 22.5 12 22.5 12C22.5 12 18.75 18.75 12 18.75C5.25 18.75 1.5 12 1.5 12Z"
                    stroke="#242424" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" />
                  <path
                    d="M12 15.25C13.7949 15.25 15.25 13.7949 15.25 12C15.25 10.2051 13.7949 8.75 12 8.75C10.2051 8.75 8.75 10.2051 8.75 12C8.75 13.7949 10.2051 15.25 12 15.25Z"
                    fill="#242424" />
                </svg>
              </button>
            </div>
          </div>

          <div class="form-options">
            <label class="remember-box">
              <input type="checkbox" checked />
              <span class="custom-checkbox"></span>
              <span>Ingat Perangkat Ini</span>
            </label>

            <a href="#" class="forgot-link">Lupa Password?</a>
          </div>

          {% if error %}
          <p style="color:#dc3937;font-size:14px;font-weight:600;margin-top:8px;">{{ error }}</p>
          {% endif %}

          <button type="submit" class="login-button">Login</button>
        </form>
      </section>

    </section>
  </main>
</body>

</html>
